name: Temporary codex changes update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_codex_changes_update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update changes.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('changes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          record = {
              "pr": 47292,
              "merged_at": "2026-09-22T13:48:13Z",
              "summary": "Multi-Agent 的 spawn、send、inspect 现在直接由共享 AgentControl 实现，删除 LocalAgentControl 的转发层和 spawn_request 模块；行为保持不变，属于内部架构重构。",
              "details": [
                  "此前 AgentControl 的 spawn、send、inspect 只是转发到 LocalAgentControl 上另一组同名/辅助方法，控制接口与本地实现之间存在一层重复包装，相关逻辑分散在 spawn_request、sender、inspect 等位置。",
                  "现在目标解析、spawn 输入校验、Agent 消息 attribution、被淘汰 runtime 的恢复以及 QueueOnly/TriggerTurn 投递语义直接收口到 LocalAgentControl 的 AgentControl trait 实现；工具 handler 和测试也统一通过 trait 方法调用。",
                  "同时删除独立的 spawn_request 模块和多余的 Box::pin/转发代码；PR 明确保留 spawn 校验、消息归属、runtime loading、follow-up 不能发给 root Agent 等既有语义，因此没有新的用户可见功能或行为变化。"
              ],
              "url": "https://github.com/openai/codex/pull/47292"
          }
          data = [item for item in data if item.get('pr') != record['pr']]
          data.append(record)
          data.sort(key=lambda item: item.get('merged_at', ''), reverse=True)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add changes.json
          git diff --cached --quiet && exit 0
          git commit -m 'Track codex PR #47292'
          git push origin HEAD:main
