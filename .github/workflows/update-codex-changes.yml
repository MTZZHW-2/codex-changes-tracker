name: Apply Codex tracker update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-codex-changes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update changes.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          new_records = [
            {
              "pr": 47437,
              "merged_at": "2026-09-23T03:19:28Z",
              "summary": "仅调整 retry/WebSocket 测试的计时、追踪捕获和 mock 端口/预热同步，减少并行或调度抖动导致的偶发失败；生产代码和用户行为不变。",
              "details": [
                "此前重试间隔测试从 telemetry 事件出现后才开始计时；测试线程若在失败请求与事件处理之间被调度挂起，下界断言就可能误判。现在改为从失败请求本身记录时间，并只统计 /responses 与对应 WebSocket stream 请求，避免无关观测干扰。",
                "测试会在需要期间保持 tracing interest-cache guard 并重建 interest cache，避免并行测试临时关闭共享 tracing callsite 后让观测失效；连接失败场景也会先占住测试端口，直到恢复服务器真正接管，消除端口绑定竞态。",
                "WebSocket 限流/过载测试现在先等待 warmup 请求并确认 generate=false，再发送用户输入，避免启动阶段与正式请求竞争。改动全部位于测试文件，属于纯测试稳定性修复，没有生产功能或用户可见变化。"
              ],
              "url": "https://github.com/openai/codex/pull/47437"
            },
            {
              "pr": 47435,
              "merged_at": "2026-09-23T03:12:47Z",
              "summary": "运行中的 turn 现在可以为后续 step 原子地切换 environment（也可与模型设置一起更新），已开始的 step 和下一 turn 的默认环境不会被这次临时切换意外改动。",
              "details": [
                "此前运行中设置更新只覆盖模型等参数，environment/workspace 选择不能作为同一份 step 设置安全更新；同时 executor 启动等待期间若环境又发生变化，后续 step 可能拿到与更新时刻不一致的选择。",
                "TurnSettingsUpdate 新增 environments，并在 step 开始前把模型设置与环境快照一起捕获：联合更新要么整体通过、要么整体拒绝；已经开始的 step 继续使用自己的快照，之后的 step 才使用新选择，而下一 turn 仍回到线程原本的默认选择。",
                "环境更新会拒绝未知或重复的 environment ID、超过 8 KiB 的工作目录，并继续校验配置归属与权限；已经由调用方提供独立配置的 environment 也不能在更新时悄悄退回线程默认配置。",
                "executor 等待被移到快照捕获之后，tool hook 也改用该 step 自己的本地工作目录，因此切换 workspace/environment 时不会因为异步启动或全局 cwd 变化把工具跑到错误位置。主要是运行时/宿主侧能力扩展，不是新的 TUI 操作入口。"
              ],
              "url": "https://github.com/openai/codex/pull/47435"
            },
            {
              "pr": 47428,
              "merged_at": "2026-09-23T02:18:54Z",
              "summary": "thread 的权限和继承环境默认值现在在单个 turn 内保持一致，运行途中保存的权限变更只会从下一 turn 起生效，避免同一 turn 的前后 step 获得不同权限。",
              "details": [
                "此前修改 thread 权限会立即刷新继承自线程的 environment 配置；如果一个 turn 正暂停或仍在执行，后面的 step 可能突然看到新权限，与该 turn 前面的 step 不一致。",
                "ThreadEnvironments 现在单独保存当前 turn 使用的 thread defaults，并在每个新 turn 激活时刷新；已经捕获 environment 的 step 保持旧值，即使 environment ID 列表没变化，下一 turn 也会应用刚保存的新默认权限。",
                "调用方显式提供的 per-environment 配置不会被线程默认值覆盖；线程派生配置仍保留各选择自己的 workspace roots，并维持本地 Windows sandbox 类型，远程 environment 不会被错误套用本地 sandbox。",
                "没有新增界面操作；实际影响是权限/沙箱边界更可预测：一个 turn 内权限保持稳定，用户或宿主修改后的设置从明确的下一 turn 边界开始生效。"
              ],
              "url": "https://github.com/openai/codex/pull/47428"
            }
          ]

          path = Path("changes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          existing = {int(item["pr"]) for item in data}
          data.extend(record for record in new_records if record["pr"] not in existing)
          data.sort(key=lambda item: item["merged_at"], reverse=True)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit update and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-codex-changes.yml
          git add changes.json
          git commit -m "Update Codex merged PR tracker"
          git push
