name: Append Codex change once

on:
  push:
    paths:
      - ".github/workflows/append-codex-change-once.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Temporary Codex change updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update changes.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("changes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          new = {
              "pr": 47108,
              "merged_at": "2026-09-21T20:42:40Z",
              "summary": "Windows 文件系统 helper 现在会保留 MXC 启动所需的 `SystemDrive` 和 `LOCALAPPDATA`，避免沙箱 helper 因找不到平台目录或本地应用数据目录而启动失败，同时仍继续过滤敏感环境变量。",
              "details": [
                  "此前 Windows helper 的环境白名单只保留 `PATH`；但 MXC 需要 `SystemDrive` 解析平台目录，并依赖 `LOCALAPPDATA` 创建沙箱化 helper 进程，这两个变量被过滤后可能导致文件系统 helper 启动或路径解析失败。",
                  "现在 Windows 侧按不区分大小写的方式允许 `PATH`、`SystemDrive` 和 `LOCALAPPDATA` 三个运行时变量，通过最小白名单补齐依赖，而不是放宽为继承整套父进程环境。",
                  "回归测试确认混合大小写的 `Path`、`LocalAppData`、`SystemDrive` 会保留，同时 `PATH_INJECTION` 和 `OPENAI_API_KEY` 仍被剔除。属于 Windows MXC/文件系统沙箱兼容性修复，没有新增用户界面功能。"
              ],
              "url": "https://github.com/openai/codex/pull/47108"
          }
          if not any(item.get("pr") == new["pr"] for item in data):
              data.append(new)
          data.sort(key=lambda item: item.get("merged_at", ""), reverse=True)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY
          rm .github/workflows/append-codex-change-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes.json .github/workflows/append-codex-change-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Track Codex PR #47108"
          git push
