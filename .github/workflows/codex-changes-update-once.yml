name: One-shot Codex changes update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-changes-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update changes.json and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('changes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          record = {
              'pr': 47236,
              'merged_at': '2026-09-22T09:40:03Z',
              'summary': 'Multi-Agent 消息板不再把帖子通知回发给发帖 Agent：即使作者订阅了频道/线程或被 agents_to_notify 显式点名，也会排除作者，同时保留其订阅以继续接收其他 Agent 的后续回复。',
              'details': [
                  '此前频道/线程订阅或 agents_to_notify 显式目标可能把作者本人也加入通知收件人，导致发帖后又收到一条自己的 CHANNEL_POST 通知，产生重复 agent_message 和无意义的上下文噪声。',
                  '现在本地消息板在合并订阅者与显式通知对象后，会在实际投递前移除当前发帖者；帖子本身仍正常保存、可搜索，其他 Agent 的通知逻辑不变。',
                  '排除自通知不会取消作者原有订阅，因此其他 Agent 后续在同一线程回复时，作者仍能收到通知；测试覆盖显式自我点名、已订阅作者以及“无自通知但帖子仍可检索”的场景。',
                  '这是 Multi-Agent 内部消息投递正确性修复，没有新增 CLI/TUI 界面功能；实际影响是减少 Agent 被自己的帖子重复唤起或污染上下文。'
              ],
              'url': 'https://github.com/openai/codex/pull/47236'
          }

          data = [item for item in data if item.get('pr') != record['pr']]
          data.append(record)
          data.sort(key=lambda item: item.get('merged_at', ''), reverse=True)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

          git rm .github/workflows/codex-changes-update-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes.json
          git commit -m "Update Codex merged PR changes"
          git push origin HEAD:main
