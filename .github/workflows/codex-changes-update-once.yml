name: Update Codex changes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-changes-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update changes.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('changes.json')
          changes = json.loads(path.read_text(encoding='utf-8'))
          new_entries = [
              {
                  "pr": 47068,
                  "merged_at": "2026-09-21T16:42:49Z",
                  "summary": "TUI transcript 选中文本时现在会把真正被选中的硬换行也高亮出来，避免 `code` 和 `code\\n` 在视觉上看起来完全相同。",
                  "details": [
                      "此前选区可以包含行尾换行符，但高亮只覆盖可见文字，复制或检查选区时无法从界面判断是否连换行一起选中了。",
                      "现在当布局还有位置时，会在硬换行末尾额外高亮一个单元格；不同 transcript 条目之间作为分隔的换行也按同样方式显示。",
                      "渲染层会区分逻辑硬换行、软换行和 synthetic row，只有真实的 line ending 才获得换行高亮，因此终端自动折行不会被误标。属于直接用户可见的文本选择准确性修复。"
                  ],
                  "url": "https://github.com/openai/codex/pull/47068"
              },
              {
                  "pr": 47065,
                  "merged_at": "2026-09-21T16:36:16Z",
                  "summary": "TUI transcript 会去重内容完全相同的全局 deprecation notice，避免隐藏线程重复投递同一弃用警告后在当前会话里出现多份相同记录。",
                  "details": [
                      "此前全局弃用通知可能由隐藏 thread 再次送达，即使 summary 和 details 与历史中的警告完全相同，也会新增一条 transcript 记录。",
                      "现在收到 deprecation notice 时会先和保留历史中的通知比较；summary 与 details 都相同就跳过，内容不同的警告仍会正常保留。",
                      "去重只针对当前保留的 transcript 历史：清空历史或切换 thread 导致 transcript 重建后，同一通知仍可以再次出现。属于直接用户可见的 TUI 去重修复，不改变弃用条件本身。"
                  ],
                  "url": "https://github.com/openai/codex/pull/47065"
              }
          ]

          existing = {item.get('pr') for item in changes}
          changes.extend(item for item in new_entries if item['pr'] not in existing)
          changes.sort(key=lambda item: item['merged_at'], reverse=True)
          path.write_text(json.dumps(changes, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

      - name: Commit update and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/codex-changes-update-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add changes.json .github/workflows/codex-changes-update-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: track merged Codex PRs'
          git push origin HEAD:main
