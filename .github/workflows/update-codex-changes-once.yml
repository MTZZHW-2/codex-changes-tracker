name: Update Codex changes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-codex-changes-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update changes.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('changes.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          new = [
            {
              "pr": 47191,
              "merged_at": "2026-09-22T04:34:13Z",
              "summary": "TUI 的数学公式富渲染现在能直接处理对齐方程、方框公式和常见优化记号，更多原本会退回 TeX 源码的公式可以在终端中保持结构化显示。",
              "details": [
                "此前 `aligned` 方程、`\\boxed`、带上下限的求和以及 `\\underset`/`\\overset` 等写法超出 TUI 的小型 TeX 子集时，整段公式往往只能退回显示原始 TeX；没有对应 Unicode 上下标的脚本也会让本可渲染的表达式失败。",
                "现在 display math 新增 `aligned`、`\\boxed`、堆叠的 `\\sum` 上下限、`\\underset`/`\\overset`、`\\substack`、大写 `\\mathcal` 和单字符 `\\widehat`；像 `x_{gpt}`、`x^{q+1}` 这类无法转换成 Unicode 脚本的内容会保留显式分组，而不是拖累整个公式。",
                "结构化布局继续受行数和宽度上限约束，语法不支持、格式损坏或终端宽度放不下时仍安全回退到源码；同时补了流式逐字符渲染与最终渲染的一致性测试。属于直接用户可见的 TUI 数学排版能力扩展。"
              ],
              "url": "https://github.com/openai/codex/pull/47191"
            },
            {
              "pr": 47185,
              "merged_at": "2026-09-22T03:49:56Z",
              "summary": "TUI 中被其他应用占用而锁定的会话现在可以直接 fork 成可编辑副本继续工作，不必等待原应用释放会话，也不会抢走原会话的所有权。",
              "details": [
                "此前会话被另一应用打开时 composer 会被禁用，TUI 只能停留在只读/锁定状态，用户无法在保留当前上下文的同时立即继续编辑。",
                "锁定视图新增 `f`/`F` 快捷键和 footer 提示；fork 会保留本地草稿以及已经排队的 prompt，并创建一个可编辑的新会话，同时原会话继续由原应用持有 lease。",
                "fork 请求进行时会显示 `Forking conversation…` 并暂时阻止额外按键，成功后提示 `Fork created. You can continue here.`；如果请求失败，则继续停留在原锁定视图并保留草稿。属于直接用户可见的 TUI 会话恢复/续作能力。"
              ],
              "url": "https://github.com/openai/codex/pull/47185"
            }
          ]

          existing = {item.get('pr') for item in current}
          merged = [item for item in new if item['pr'] not in existing] + current
          merged.sort(key=lambda item: item['merged_at'], reverse=True)
          path.write_text(json.dumps(merged, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

          if git diff --quiet -- changes.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add changes.json
          git commit -m 'Update Codex changes'
          git push origin HEAD:main
