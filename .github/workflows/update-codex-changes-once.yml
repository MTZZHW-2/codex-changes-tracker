name: Update Codex changes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-codex-changes-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update changes.json and remove one-shot workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          new_records = [
              {
                  "pr": 47303,
                  "merged_at": "2026-09-22T15:05:59Z",
                  "summary": "已有 Guardian 审查线程的旧元数据会在数据库迁移时被清理为稳定的简短标题和预览，并保留用户自定义名称，避免历史列表继续显示整段合成审批 prompt。",
                  "details": [
                      "#47302 只修正新生成的 Guardian 线程元数据；旧 SQLite 记录里仍可能把合成审批 prompt 当作 title、preview 或 first_user_message，导致历史线程列表冗长且难读。",
                      "这次迁移会把空白或由审批 prompt 推导出的默认标题统一改成 “Guardian review”，preview 改成 “Approval review”，并清空 first_user_message；如果已有自定义 name 会保留，没有 name 但 title 本来是自定义文本时则先把它保存为 name。",
                      "迁移只重写 SQLite 中用于列表展示的派生元数据，rollout JSONL 仍是权威会话历史，Guardian 的实际审查逻辑、授权结果和 transcript 内容不变。"
                  ],
                  "url": "https://github.com/openai/codex/pull/47303"
              },
              {
                  "pr": 47302,
                  "merged_at": "2026-09-22T14:55:24Z",
                  "summary": "新建 Guardian 审查线程不再把内部合成审批 prompt 当作会话标题或首条用户消息，而是输出稳定、简短的线程元数据，避免客户端列表被长提示污染。",
                  "details": [
                      "此前 Guardian review 会在 transcript 中注入一段很长的 synthetic approval prompt，通用 thread metadata 提取逻辑会误把它当作 title、preview 和 first_user_message，客户端列出线程时可能看到大段内部审批文本。",
                      "现在 Guardian 线程默认 title 固定为 “Guardian review”、preview 为 “Approval review”，并跳过 synthetic User/Goal item 的元数据提取，同时让 first_user_message 为空。",
                      "已有用户自定义名称或标题仍会保留；改动只影响 app-server/持久化层暴露给客户端的线程元数据，不改变 Guardian 的实际审查内容或 allow/deny 行为。"
                  ],
                  "url": "https://github.com/openai/codex/pull/47302"
              },
              {
                  "pr": 47301,
                  "merged_at": "2026-09-22T14:41:15Z",
                  "summary": "Multi-Agent 本地控制层把整棵 Agent 树共享的 runtime 状态从每个 session 的控制器中拆出，由独立 LocalAgentRuntime 统一持有；这是内部架构重构，用户行为不变。",
                  "details": [
                      "此前 LocalAgentControl 同时保存当前 session 身份和整棵 Agent 树共用的 registry、容量/预算、residency、生命周期通知等状态，session 绑定与共享 runtime 职责混在一起。",
                      "现在新增 LocalAgentRuntime 承载树级共享状态并存入 SessionServices；LocalAgentControl 只保留 session_id 和指向共享 runtime 的引用，spawn、resume、Guardian 等子线程控制器都从同一 runtime 重新绑定。",
                      "这样可保证不同 session handle 继续共享同一 registry、限流/预算和 runtime residency，也为后续替换 Agent 后端或进一步解耦控制面打基础；PR 没有新增 CLI/TUI 功能，也不应改变现有 Multi-Agent 语义。"
                  ],
                  "url": "https://github.com/openai/codex/pull/47301"
              }
          ]

          path = Path("changes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          existing = {item.get("pr") for item in data}
          data.extend(record for record in new_records if record["pr"] not in existing)
          data.sort(key=lambda item: item["merged_at"], reverse=True)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-codex-changes-once.yml
          git add changes.json
          git commit -m "Update Codex merged PR changes"
          git push
