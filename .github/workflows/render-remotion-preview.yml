name: Render Remotion preview

on:
  push:
    branches: [main]
    paths:
      - 'video/**'
      - 'changes.json'
      - '.github/workflows/render-remotion-preview.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Render MP4
        working-directory: video
        run: npm run render

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: codex-remotion-preview
          path: codex-remotion-preview.mp4
          retention-days: 7
