name: Render Remotion preview

on:
  push:
    branches: [main]
    paths:
      - 'video/render-trigger.txt'
      - '.github/workflows/render-remotion-preview.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg

      - name: Install video dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Install TTS
        run: pip install edge-tts

      - name: Generate voiceover
        working-directory: video
        run: python scripts/generate_voice.py

      - name: Render MP4
        working-directory: video
        run: npm run render

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: codex-remotion-preview
          path: codex-remotion-preview.mp4
          retention-days: 2
