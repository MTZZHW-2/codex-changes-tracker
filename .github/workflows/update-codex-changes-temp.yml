name: Temporary Codex changes updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-codex-changes-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update changes.json
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("changes.json")
          items = json.loads(path.read_text(encoding="utf-8"))
          record = {
              "pr": 47199,
              "merged_at": "2026-09-22T05:53:44Z",
              "summary": "首个 turn 前注入的准备上下文现在使用独立持久化检查点：托管存储可延后派生元数据写入以减少启动阻塞，本地存储仍会立即刷盘，保证重启后上下文不丢。",
              "details": [
                  "此前 `inject_response_items()` 会直接执行完整 `flush_rollout()`；仅仅在首轮前注入 developer/host context 也要等待整套持久化和 rollout 派生 metadata 写入，可能拖慢第一轮开始。",
                  "现在新增 `PersistContext::ThreadPreparation` 和 `checkpoint_preparation()`；非标准 checkpoint 可通过 `record_thread_metadata()` 延后 rollout-derived metadata，而普通显式 metadata 更新仍保持同步，因此 hosted store 可以把准备阶段从完整 durability barrier 中拆开。",
                  "本地 `LocalThreadStore` 对 preparation checkpoint 仍调用 `flush_thread`，所以用户尚未发送第一条消息时，已注入 context 就已经写入 rollout；测试覆盖 Legacy/Paginated history 下重启恢复，并确认第一轮和后续轮都继续携带该 context。属于内部持久化/启动性能与可靠性改进，没有直接 UI 变化。"
              ],
              "url": "https://github.com/openai/codex/pull/47199"
          }

          if not any(item.get("pr") == record["pr"] for item in items):
              items.append(record)
              items.sort(key=lambda item: item["merged_at"], reverse=True)
              path.write_text(
                  json.dumps(items, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
      - name: Commit changes
        run: |
          if git diff --quiet -- changes.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes.json
          git commit -m "[skip ci] update Codex changes"
          git push origin HEAD:main
