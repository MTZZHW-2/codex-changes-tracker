name: Update Codex changes (temporary)

on:
  push:
    paths:
      - '.github/workflows/update-codex-changes-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update changes.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('changes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          new = [
            {
              "pr": 47424,
              "merged_at": "2026-09-23T01:41:30Z",
              "summary": "TUI 在回合结束、失败或中断时会一并清掉已经失效的异步提问通知，避免旧问题继续压住正常的回合完成通知。",
              "details": [
                "此前异步问题已经随着 turn 结束而不再有效时，对应 `AsyncQuestion` 通知仍可能留在待发送队列；因为它优先级更高，会让后续 turn-complete 通知被抑制。",
                "现在在收集或回收未发送的问题草稿时，同步清理这些待处理通知，并覆盖正常完成、中断、失败和错误处理路径。",
                "用户可见影响是后台问题消失后，回合完成通知能正常出现；不改变问题回答内容或模型执行逻辑，属于 TUI 通知状态正确性修复。"
              ],
              "url": "https://github.com/openai/codex/pull/47424"
            },
            {
              "pr": 47423,
              "merged_at": "2026-09-23T01:41:06Z",
              "summary": "TUI 在后台恢复未发送草稿时不再打断正在进行的 Ctrl+R 历史搜索；取消搜索会拿回更新后的草稿，而接受历史匹配则按用户选择丢弃该恢复内容。",
              "details": [
                "此前 turn 结束、失败或中断触发草稿恢复时，活跃的 Ctrl+R 历史搜索可能被取消，或恢复内容直接覆盖当前搜索预览，用户容易丢掉正在查找的位置。",
                "现在后台恢复只更新 history search 保存的 draft，不改变查询词或当前预览；按 Esc/Ctrl+C 退出时恢复这份最新 draft，接受某条历史匹配时则明确采用匹配项。",
                "draft snapshot 也改为记录真正保存的草稿而非屏幕预览，附件、mention 绑定和 pending paste 可随取消搜索一起恢复；显式替换为新草稿会结束搜索，避免旧内容被取消操作重新带回。",
                "这是直接用户可见的输入/历史搜索可靠性修复；搜索没有匹配项时按 Enter 也会继续停留在搜索状态。"
              ],
              "url": "https://github.com/openai/codex/pull/47423"
            },
            {
              "pr": 47422,
              "merged_at": "2026-09-23T01:37:42Z",
              "summary": "异步问题尚未提交的答案在 turn 完成、失败或中断时不再丢失，而会按原顺序回收到主输入框中供用户继续编辑。",
              "details": [
                "此前 live turn 结束时，异步问题可能随状态清理而消失，用户已经输入但尚未提交的答案也可能跟着丢掉。",
                "现在会清理已结束 turn 的 pending question，并把非空答案按问题顺序追加回 composer，但不会自动发送；已有 composer 内容和中断后恢复的输入都会保留。",
                "大段答案继续使用 paste placeholder，恢复过程会正确处理 history preview、pending Vim command、undo/redo 与 dot-repeat，避免编辑状态被破坏。",
                "replay 时不会重复恢复；如果因 misalignment policy 违规而要求清空输入，则仍保持清空。属于直接用户可见的 TUI 草稿防丢修复。"
              ],
              "url": "https://github.com/openai/codex/pull/47422"
            },
            {
              "pr": 47417,
              "merged_at": "2026-09-23T01:20:43Z",
              "summary": "通过 SSH 在 macOS Terminal.app 中运行 Codex 时，`tui.alternate_screen=auto` 会自动改用 inline/native scrollback，避免全屏 alternate screen 吞掉终端原生滚动历史。",
              "details": [
                "此前 auto 模式无法可靠识别 SSH 另一端的 Terminal.app，可能仍进入 alternate screen，用户退出或滚动时看不到期望的原生 scrollback。",
                "现在 Unix SSH 会在没有检测到 tmux 等 multiplexer 时，通过 primary/secondary device attributes 探测 Terminal.app；会忽略 bracketed paste 中的伪签名，并把不完整响应视为未知。",
                "一旦确认是 Terminal.app，auto 模式会在第一帧绘制前选择 inline mode，并在后续配置载入时保持该决定；显式 `always`、`never` 和 `--no-alt-screen` 继续优先于自动判断。",
                "这是直接用户可见的终端兼容性改进；同时更新了 crossterm 依赖以支持相应探测和终端行为。"
              ],
              "url": "https://github.com/openai/codex/pull/47417"
            }
          ]

          by_pr = {item['pr']: item for item in data}
          for item in new:
              by_pr.setdefault(item['pr'], item)
          merged = sorted(by_pr.values(), key=lambda item: item['merged_at'], reverse=True)
          path.write_text(json.dumps(merged, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

          if git diff --quiet -- changes.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add changes.json
          git commit -m 'Update Codex merged PRs'
          git push origin main
