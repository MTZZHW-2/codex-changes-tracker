name: One-off Codex changes update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-tracker-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update changes.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('changes.json')
          existing = json.loads(path.read_text(encoding='utf-8'))
          new_records = [
              {
                  "pr": 46938,
                  "merged_at": "2026-09-21T03:39:00Z",
                  "summary": "TUI 新增独立渲染开关，可分别关闭 Mermaid、数学公式和表格的富渲染；关闭某一项后改为显示对应 Markdown 源码，而且这些设置不再和动画开关绑在一起。",
                  "details": [
                      "此前 Mermaid、数学公式和表格的终端富渲染没有各自独立的用户开关；现在新增 `tui.rendering.mermaid`、`tui.rendering.math` 和 `tui.rendering.tables`，三项默认都为 true，因此未改配置的用户行为保持不变。",
                      "单独关闭某项后，TUI 会停止把对应内容转换成流程图、Unicode 数学排版或格式化表格，转而保留并显示原始源码；表格关闭时还会保留 pipe 语法、单元格 Markdown 和外层 fence，方便直接查看原内容。",
                      "这些偏好同时作用于流式输出、完成后的回答、启动预览和会话中的设置变化，并且与 `tui.animations` 独立；HTML 剪贴板格式仍按原逻辑生成，不会因为终端渲染被关闭而降级。",
                      "属于直接用户可见的 TUI 显示配置扩展，默认渲染效果没有变化。"
                  ],
                  "url": "https://github.com/openai/codex/pull/46938"
              },
              {
                  "pr": 46931,
                  "merged_at": "2026-09-21T03:02:59Z",
                  "summary": "全屏 TUI 的 composer 提示改为使用共享 tip 目录并读取用户真实快捷键，避免自定义 keymap 后仍显示错误按键，同时会根据可用空间挑选完整的一行提示并支持其中的链接。",
                  "details": [
                      "此前 fullscreen composer 只轮换一小组固定提示，而共享 tip 目录里的快捷键文案又写死默认绑定；用户改过 keymap 后，界面可能继续提示已经不正确的按键。",
                      "现在 `{key:context.action}` 这类占位符会按当前 primary shortcut 或 chord 实时解析；动作无效或没有绑定时直接跳过该提示，并只选择能完整塞进 composer 上方空隙的一行 tip，重绘时保持稳定、不同会话和 turn 之间再适度变化。",
                      "启动公告在用户第一次真正开始 turn 前拥有更高优先级，但清空历史后不会重新冒出来；usage notice 和交互控件仍优先于普通 tip，同时继续遵守 `show_tooltips`、空输入和 idle 状态。",
                      "composer 与 session tip 现在共用 Markdown 渲染，提示中的链接会保留并可用 Ctrl/Super 点击打开。属于直接用户可见的提示准确性和交互改进。"
                  ],
                  "url": "https://github.com/openai/codex/pull/46931"
              },
              {
                  "pr": 46929,
                  "merged_at": "2026-09-21T02:46:44Z",
                  "summary": "TUI 读取 `config.toml` 失败时去掉错误文本里多余的 `Error` 前缀，只保留更简洁的 `loading config.toml:` 提示；配置加载和错误细节本身没有变化。",
                  "details": [
                      "此前配置加载失败会包装成 `Error loading config.toml:`，在外层错误展示本身已经带错误语义时显得重复。",
                      "这次唯一的生产代码改动是把该前缀改成 `loading config.toml:`；后面的具体配置解析错误和来源信息仍由原来的 formatter 生成。",
                      "属于纯错误文案/UI 清理，不改变 `config.toml` 的解析、校验、启动失败条件或其他运行逻辑。"
                  ],
                  "url": "https://github.com/openai/codex/pull/46929"
              }
          ]

          by_pr = {item['pr']: item for item in existing}
          for item in new_records:
              by_pr.setdefault(item['pr'], item)
          merged = sorted(by_pr.values(), key=lambda item: item['merged_at'], reverse=True)
          path.write_text(json.dumps(merged, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/codex-tracker-update-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add changes.json .github/workflows/codex-tracker-update-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update Codex merged PR changes'
          git push
