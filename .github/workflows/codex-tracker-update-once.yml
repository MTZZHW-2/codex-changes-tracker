name: Update Codex tracker once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-tracker-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update changes.json
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('changes.json')
          changes = json.loads(path.read_text(encoding='utf-8'))
          additions = [
            {
              "pr": 47272,
              "merged_at": "2026-09-22T12:37:26Z",
              "summary": "Guardian 的同步审查不再因为父线程压缩检查点的 comp_hash 与当前 reviewer 不同或缺失就拒绝复用；只要检查点内容可用就交给后端验证，从而避免恢复或压缩后丢掉本可用于授权判断的证据。",
              "details": [
                "此前 ThreadOwned Guardian 会把压缩检查点的生产模型 hash 与 reviewer 的 comp_hash 做严格兼容判断；模型切换、hash 缺失或为空时，即使加密检查点实际可读，也会直接 fail closed，导致保留证据不能用于同步审查。",
                "现在移除这层 hash 比对和相关参数传递，ThreadOwned 只检查 checkpoint 本身是否 usable；可用检查点继续传给 synchronous review backend，由后端验证实际 payload。",
                "空或损坏的 checkpoint 和真正的 review 错误仍然 fail closed；测试覆盖 reviewer hash 不同、未知、空值时仍保留证据。属于 Guardian 审查正确性/兼容性修复，没有新增 UI，但会减少本来可审查的动作被错误拒绝。"
              ],
              "url": "https://github.com/openai/codex/pull/47272"
            },
            {
              "pr": 47271,
              "merged_at": "2026-09-22T12:19:20Z",
              "summary": "LocalAgentControl 现在真正实现共享的 AgentControl 接口，并把接口契约调整为现有本地 Multi-Agent 的真实语义，为后续替换或抽象 Agent 后端建立统一控制面；当前用户可见行为不变。",
              "details": [
                "此前 AgentControl 只是面向未来后端的抽象，部分签名（分页查询、原子容量预留、完成去重等）与现有 LocalAgentControl 实际行为不一致，也没有直接实现关系。",
                "现在新增适配层，把 spawn/resume/send/interrupt/close/watch、预算、Guardian 证据和共享设置等统一委托给现有本地控制器；spawn/resume 同时返回实际生效的线程配置，状态和列表语义也对齐现有实现。",
                "接口明确把‘容量是否足够’的 advisory check 与实际执行 guard 分开，并保留本地完成通知 best-effort、Guardian evidence 可缺失等现有语义；同时删除未实际使用的分页 AgentQuery/AgentPage 等类型。",
                "属于内部架构/接口重构，为未来非本地 Agent backend 铺路；没有新增 CLI/TUI 操作，也不应改变现有 Multi-Agent 结果。"
              ],
              "url": "https://github.com/openai/codex/pull/47271"
            },
            {
              "pr": 47267,
              "merged_at": "2026-09-22T11:44:15Z",
              "summary": "Multi-Agent 的本地状态订阅从只推送 AgentStatus 的 Tokio watch 改为流式 AgentInfo 快照，连同 metadata 和实际配置一起传递，并确保 runtime 被卸载后最后状态仍可被 wait/completion 逻辑可靠读取。",
              "details": [
                "此前订阅直接暴露 watch::Receiver<AgentStatus>，只能看到状态值，而且持有或查询 runtime 的时机容易与 shutdown/unload 竞态；如果订阅尚未首次读取时状态已变化，也缺少完整初始快照。",
                "现在订阅先产出一份包含 thread ID、metadata、status、ThreadConfigSnapshot 的初始 AgentInfo，再流式给出合并后的后续状态；对 runtime 只保留 weak reference，并记住最后一次配置，所以 runtime 消失后仍能发布终态快照。",
                "wait_agent 与子 Agent completion 通知改为消费这条快照流：订阅错误不再被吞掉，流正常结束但没看到终态时会回查最新状态；测试覆盖 shutdown 发生在首次 poll 前仍先看到 PendingInit 再看到 Shutdown。",
                "属于 Multi-Agent 内部状态/生命周期正确性重构，没有新增用户界面；实际意义是等待和完成通知在关闭、卸载边界下更不容易漏状态或丢配置。"
              ],
              "url": "https://github.com/openai/codex/pull/47267"
            }
          ]

          existing = {item['pr'] for item in changes}
          changes.extend(item for item in additions if item['pr'] not in existing)
          changes.sort(key=lambda item: item['merged_at'], reverse=True)
          path.write_text(json.dumps(changes, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

      - name: Commit tracker update and remove temporary workflow
        run: |
          rm .github/workflows/codex-tracker-update-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes.json .github/workflows/codex-tracker-update-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Track merged Codex PRs 47267-47272"
          git push origin HEAD:main
