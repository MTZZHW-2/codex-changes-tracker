<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Changes</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:32px;color:#111;background:#fff}
    main{max-width:1100px;margin:auto}
    h1{font-size:20px;margin:0 0 20px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
    th{font-weight:600}
    td:first-child{white-space:nowrap;width:150px}
    td:nth-child(2){white-space:nowrap;width:80px}
    a{color:inherit}
    @media(max-width:700px){body{margin:16px}table{font-size:13px}td:first-child{width:auto}}
  </style>
</head>
<body>
  <main>
    <h1>Codex Changes</h1>
    <table>
      <thead>
        <tr><th>时间</th><th>PR</th><th>改动</th></tr>
      </thead>
      <tbody id="changes"></tbody>
    </table>
  </main>
  <script>
    fetch('./changes.json')
      .then(r => r.json())
      .then(items => {
        document.querySelector('#changes').innerHTML = items.map(item => {
          const time = new Date(item.merged_at).toLocaleString('zh-CN', {hour12:false});
          return `<tr><td>${time}</td><td><a href="${item.url}" target="_blank" rel="noreferrer">#${item.pr}</a></td><td>${item.title}</td></tr>`;
        }).join('');
      });
  </script>
</body>
</html>
